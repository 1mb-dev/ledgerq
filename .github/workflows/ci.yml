name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A Dependabot auto-merge is pushed by GITHUB_TOKEN, which starts no push run, so main is
  # unverified until the next daily run. Dispatch verifies it on demand.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: 1mb-dev/.github/.github/workflows/ci-go.yml@main
    with:
      build-binary: "./cmd/ledgerq"

  # The release ships ledgerq-windows-amd64.exe and validation_windows.go is Windows-only;
  # the shared workflow runs on Linux alone.
  windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
      - run: go test ./...
      - run: go build -o ledgerq.exe ./cmd/ledgerq
      - run: ./ledgerq.exe version
